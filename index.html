<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Pengisian Data M-KK Risk Sulawesi Tengah (Form 2 - 10)</title>
<style>
:root{
  --navy:#122540;
  --navy-2:#1c3a5e;
  --paper:#f6f3ec;
  --paper-2:#ffffff;
  --ink:#1b1b1b;
  --muted:#6b6f76;
  --line:#dcd6c7;
  --gold:#b6842c;
  --gold-2:#e4b356;
  --green:#3f7a4f;
  --amber:#c98a1f;
  --red:#b5442e;
  --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -14px rgba(18,37,64,.25);
  --radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:'Georgia',"Source Sans Pro",Arial,sans-serif;
  font-size:15px;line-height:1.5;
}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:270px;flex-shrink:0;background:var(--navy);color:#e9ecf1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand .eyebrow{font-family:'Source Sans Pro',Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);font-weight:600;}
.brand h1{font-family:Georgia,serif;font-size:19px;margin:6px 0 4px;line-height:1.25;font-weight:700;}
.brand .sub{font-size:12.5px;color:#b9c2d1;}
nav.menu{padding:10px 10px 20px;flex:1;}
.menu-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#d7dce6;
  padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;font-family:'Source Sans Pro',Arial,sans-serif;margin-top:2px;
}
.menu-item:hover{background:rgba(255,255,255,.06);}
.menu-item.active{background:var(--gold);color:#1a1200;font-weight:700;}
.menu-item .code{
  font-family:Georgia,serif;font-weight:700;font-size:11px;flex-shrink:0;width:26px;height:20px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);border-radius:4px;
}
.menu-item.active .code{background:rgba(0,0,0,.18);}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:#8a93a6;}

/* Main Content */
main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:5;background:var(--paper-2);border-bottom:1px solid var(--line);
  padding:14px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar .crumbs{font-size:12px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;font-family:'Source Sans Pro',Arial,sans-serif;}
.topbar h2{font-family:Georgia,serif;margin:2px 0 0;font-size:22px;}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.btn{
  font-family:'Source Sans Pro',Arial,sans-serif;font-size:13px;font-weight:600;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--navy-2);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{border-color:var(--navy-2);}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1a1200;}
.btn-gold:hover{background:var(--gold-2);}
.save-pill{font-size:11.5px;color:var(--green);font-family:'Source Sans Pro',Arial,sans-serif;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .3s;}
.save-pill.show{opacity:1;}

.content{padding:26px 34px 80px;max-width:1180px;}
.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.panel h3{font-family:Georgia,serif;font-size:17px;margin:0 0 4px;}
.panel .desc{font-size:13px;color:var(--muted);margin-bottom:16px;font-family:'Source Sans Pro',Arial,sans-serif;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-2);font-family:'Source Sans Pro',Arial,sans-serif;}
input[type=text],input[type=number],textarea,select{
  font-family:'Source Sans Pro',Arial,sans-serif;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:#fdfcf9;color:var(--ink);width:100%;
}
textarea{resize:vertical;min-height:38px;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold-2);border-color:var(--gold);}

/* Hero Banner */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:var(--radius);
  padding:30px 32px;margin-bottom:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:700;font-family:'Source Sans Pro',Arial,sans-serif;}
.hero h2{font-family:Georgia,serif;font-size:26px;margin:8px 0 8px;}
.hero p{font-size:13.5px;color:#cfd6e3;max-width:560px;font-family:'Source Sans Pro',Arial,sans-serif;}

/* Logo & Badge */
.brand-row{display:flex;align-items:center;gap:12px;}
.logo-circle{
  width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--gold-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.logo-circle img{width:100%;height:100%;object-fit:contain;}
.logo-circle .mono{font-family:Georgia,serif;font-weight:700;color:var(--navy);font-size:16px;}
.logo-edit{font-size:10.5px;color:#9aa5ba;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-top:6px;font-family:'Source Sans Pro',Arial,sans-serif;}
.logo-edit:hover{color:var(--gold-2);}
.hero-logo{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-bottom:12px;}
.hero-logo img{width:100%;height:100%;object-fit:contain;}

.user-badge{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--navy-2);font-family:'Source Sans Pro',Arial,sans-serif;background:#eef1f6;border-radius:20px;padding:6px 12px 6px 6px;}
.user-badge .av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.link-btn{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
.link-btn:hover{color:var(--red);}

/* Login Overlay */
.login-overlay{
  position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,#0c1a2e 100%);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.login-card{background:var(--paper-2);border-radius:14px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;}
.login-head{background:var(--navy);padding:26px 28px 20px;text-align:center;color:#fff;}
.login-head .logo-circle{margin:0 auto 12px;width:60px;height:60px;}
.login-head .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:700;}
.login-head h2{font-family:Georgia,serif;font-size:18px;margin:6px 0 2px;}
.login-head .sub{font-size:11.5px;color:#b9c2d1;}
.login-body{padding:22px 28px 28px;}
.login-tabs{display:flex;gap:6px;margin-bottom:18px;background:#f0ede2;border-radius:8px;padding:4px;}
.login-tab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:12.5px;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted);}
.login-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.pin-wrap{position:relative;}
.pin-wrap input{padding-right:48px;letter-spacing:2px;}
.pin-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:11.5px;padding:4px;}
.login-error{background:#fbeae5;color:var(--red);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:10px;display:none;}
.login-error.show{block;}
.toggle-row{display:flex;align-items:center;gap:10px;margin:8px 0 14px;}
.toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:#d5d0c1;border-radius:22px;transition:.2s;}
.toggle .slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.toggle input:checked + .slider{background:var(--gold);}
.toggle input:checked + .slider::before{transform:translateX(18px);}
.toggle-row label{font-size:12.5px;color:var(--muted);cursor:pointer;}
.btn-block{width:100%;justify-content:center;margin-top:6px;padding:10px;}
</style>
</head>
<body>

<!-- LAYAR MASUK / LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-head">
      <div class="logo-circle" id="loginLogoCircle"><span class="mono">ST</span></div>
      <div class="eyebrow">Manajemen Risiko 2026</div>
      <h2>Aplikasi M-KK Risk Sulawesi Tengah</h2>
      <div class="sub">Pemerintah Provinsi Sulawesi Tengah</div>
    </div>
    <div class="login-body">
      <div class="login-tabs">
        <button class="login-tab active" id="tabMasuk">Masuk</button>
        <button class="login-tab" id="tabDaftar">Daftar Akun</button>
      </div>
      <div class="login-error" id="loginError"></div>

      <form id="formMasuk">
        <div class="field">
          <label>Nama Pengguna</label>
          <input type="text" id="loginUsername" placeholder="mis. admin" autocomplete="username">
        </div>
        <div class="field">
          <label>PIN Akses</label>
          <div class="pin-wrap">
            <input type="password" id="loginPin" maxlength="8" placeholder="••••" autocomplete="current-password">
            <button type="button" class="pin-toggle" id="toggleLoginPin">Lihat</button>
          </div>
        </div>
        <div class="toggle-row">
          <label class="toggle"><input type="checkbox" id="rememberToggle"><span class="slider"></span></label>
          <label for="rememberToggle">Ingat nama pengguna</label>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Masuk Aplikasi</button>
      </form>

      <form id="formDaftar" style="display:none;">
        <div class="field">
          <label>Nama Pengguna Baru</label>
          <input type="text" id="regUsername" placeholder="mis. staf.dpmd" autocomplete="username">
        </div>
        <div class="field">
          <label>Buat PIN (4-8 digit)</label>
          <div class="pin-wrap">
            <input type="password" id="regPin" maxlength="8" placeholder="••••" autocomplete="new-password">
            <button type="button" class="pin-toggle" id="toggleRegPin">Lihat</button>
          </div>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Daftar & Masuk</button>
      </form>
    </div>
  </div>
</div>

<!-- APLIKASI UTAMA -->
<div class="app" id="appRoot" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="logo-circle" id="sidebarLogoCircle"><span class="mono">ST</span></div>
        <div>
          <div class="eyebrow">Manajemen Risiko</div>
          <h1>M-KK Risk Sulteng</h1>
        </div>
      </div>
      <div class="sub">Formulir 2 sampai 10 Terpadu</div>
      <button class="logo-edit" id="btnChangeLogo">Ubah Logo Instansi</button>
      <input type="file" id="logoFileInput" accept="image/*" style="display:none">
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sidebar-foot">Data tersimpan otomatis · Siap Cetak PDF & Excel</div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="crumbs" id="crumb">Beranda</div>
        <h2 id="pageTitle">Dasbor Utama</h2>
      </div>
      <div class="topbar-actions">
        <span class="save-pill" id="savePill">✓ Tersimpan</span>
        <span class="user-badge" id="userBadge"></span>
        <button class="btn btn-gold" id="btnExport">⬇ Ekspor Excel</button>
        <button class="btn btn-primary" id="btnPrintPdf">🖨 Cetak PDF Lengkap</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
// Data Logika Form & State Pengguna
const RAW_DATA = {
  form2b: {
    tujuanStrategis: "Meningkatnya Pemberdayaan Masyarakat dan Kemandirian Desa",
    iku: [{no:"1.", uraian:"Indeks Desa", target:72.47, satuan:"%"}],
    ttdTempatTanggal: "Palu, Desember 2026", ttdJabatan: "Kepala Dinas PMD Provinsi Sulteng",
    ttdNama: "IHSAN BASIR, S.H.,LL.M", ttdPangkat: "Pembina Utama Madya", ttdNip: "NIP. 197011091998031016"
  },
  form3b: {
    records: [{no:"1.", kode:"RSO.26.13.16.01", risiko:"Penyesuaian IDM Menjadi Indeks Desa", sebab:"Belum sepenuhnya dipahami", dampak:"Status desa menurun", sumber:"eksternal"}]
  }
};

// Toggle Login / Daftar Tabs
document.getElementById('tabMasuk').addEventListener('click', () => {
  document.getElementById('tabMasuk').classList.add('active');
  document.getElementById('tabDaftar').classList.remove('active');
  document.getElementById('formMasuk').style.display = 'block';
  document.getElementById('formDaftar').style.display = 'none';
});
document.getElementById('tabDaftar').addEventListener('click', () => {
  document.getElementById('tabDaftar').classList.add('active');
  document.getElementById('tabMasuk').classList.remove('active');
  document.getElementById('formDaftar').style.display = 'block';
  document.getElementById('formMasuk').style.display = 'none';
});

// Toggle PIN Visibility
function setupTogglePin(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', () => {
    if(input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Sembunyi';
    } else {
      input.type = 'password';
      btn.textContent = 'Lihat';
    }
  });
}
setupTogglePin('loginPin', 'toggleLoginPin');
setupTogglePin('regPin', 'toggleRegPin');

// Autentikasi Pengguna
let currentUser = localStorage.getItem('mkk_user') || '';
const savedUserField = localStorage.getItem('mkk_saved_user');
if(savedUserField) {
  document.getElementById('loginUsername').value = savedUserField;
  document.getElementById('rememberToggle').checked = true;
}

document.getElementById('formMasuk').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPin').value.trim();
  if(!u || !p) { showLoginError('Nama pengguna dan PIN wajib diisi.'); return; }
  if(document.getElementById('rememberToggle').checked) localStorage.setItem('mkk_saved_user', u);
  currentUser = u;
  localStorage.setItem('mkk_user', u);
  initApp();
});

document.getElementById('formDaftar').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('regUsername').value.trim();
  const p = document.getElementById('regPin').value.trim();
  if(!u || !p) { showLoginError('Semua kolom wajib diisi.'); return; }
  currentUser = u;
  localStorage.setItem('mkk_user', u);
  initApp();
});

function showLoginError(msg) {
  const err = document.getElementById('loginError');
  err.textContent = msg;
  err.classList.add('show');
  setTimeout(() => err.classList.remove('show'), 3500);
}

// Logo Instansi Manager
const savedLogo = localStorage.getItem('mkk_logo');
if(savedLogo) applyLogo(savedLogo);

document.getElementById('btnChangeLogo').addEventListener('click', () => {
  document.getElementById('logoFileInput').click();
});
document.getElementById('logoFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const dataUrl = evt.target.result;
      localStorage.setItem('mkk_logo', dataUrl);
      applyLogo(dataUrl);
    };
    reader.readAsDataURL(file);
  }
});

function applyLogo(url) {
  ['sidebarLogoCircle', 'loginLogoCircle', 'heroLogoCircle'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = `<img src="${url}" alt="Logo Sulawesi Tengah">`;
  });
}

function initApp() {
  if(!currentUser) return;
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appRoot').style.display = 'flex';
  document.getElementById('userBadge').innerHTML = `<div class="av">${currentUser[0].toUpperCase()}</div><b>${currentUser}</b> <button class="link-btn" id="btnLogout">Keluar</button>`;
  document.getElementById('btnLogout').addEventListener('click', () => {
    localStorage.removeItem('mkk_user');
    location.reload();
  });
  renderNavigation();
  renderContent('home');
}

if(currentUser) { initApp(); }

// Navigasi Form 2 hingga Form 10
const menuData = [
  {id:'home', code:'00', title:'Beranda Utama'},
  {id:'form2b', code:'2B', title:'Penilaian Risiko Strategis'},
  {id:'form2c', code:'2C', title:'Identifikasi Program & Kegiatan'},
  {id:'form3b', code:'3B', title:'Register Risiko Strategis'},
  {id:'form3c', code:'3C', title:'Peta Risiko Strategis'},
  {id:'form4', code:'04', title:'Analisis Risiko'},
  {id:'form5', code:'05', title:'Evaluasi Risiko'},
  {id:'form6', code:'06', title:'Rencana Tindak Pengendalian (RTP)'},
  {id:'form7', code:'07', title:'Register Risiko Operasional'},
  {id:'form8', code:'08', title:'Peta Risiko Operasional'},
  {id:'form9', code:'09', title:'Pemantauan & Reviu'},
  {id:'form10', code:'10', title:'Pencatatan Kejadian Risiko'}
];

function renderNavigation() {
  const menuEl = document.getElementById('menu');
  menuEl.innerHTML = menuData.map(m => `
    <button class="menu-item ${m.id==='home'?'active':''}" data-id="${m.id}">
      <span class="code">${m.code}</span>
      <span>${m.title}</span>
    </button>
  `).join('');
  
  menuEl.querySelectorAll('.menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      menuEl.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent(btn.dataset.id);
    });
  });
}

function renderContent(id) {
  const content = document.getElementById('content');
  const crumb = document.getElementById('crumb');
  const pageTitle = document.getElementById('pageTitle');
  
  if(id === 'home') {
    crumb.textContent = 'Beranda';
    pageTitle.textContent = 'Dasbor M-KK Risk Sulawesi Tengah';
    content.innerHTML = `
      <div class="hero">
        <div class="hero-logo" id="heroLogoCircle"><span class="mono">ST</span></div>
        <div class="eyebrow">Pemerintah Provinsi Sulawesi Tengah</div>
        <h2>Aplikasi M-KK Risk Terpadu (Form 2 - 10)</h2>
        <p>Sistem manajemen risiko resmi Dinas Pemberdayaan Masyarakat dan Desa Provinsi Sulawesi Tengah.</p>
      </div>
      <div class="panel">
        <h3>Navigasi Modul Formulir</h3>
        <p class="desc">Gunakan menu di sebelah kiri untuk berpindah antar formulir penilaian risiko secara interaktif.</p>
      </div>
    `;
    if(savedLogo) {
      const hLogo = document.getElementById('heroLogoCircle');
      if(hLogo) hLogo.innerHTML = `<img src="${savedLogo}" alt="Logo">`;
    }
  } else {
    const item = menuData.find(m => m.id === id);
    crumb.textContent = `Form ${item.code}`;
    pageTitle.textContent = item.title;
    content.innerHTML = `
      <div class="panel">
        <h3>${item.title}</h3>
        <div class="desc">Formulir aktif pengisian data manajemen risiko daerah.</div>
        <div class="field">
          <label>Catatan / Keterangan Isian Form ${item.code}</label>
          <textarea placeholder="Masukkan data atau uraian analisis risiko di sini..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="alert('Data berhasil disimpan secara lokal.')">Simpan Perubahan Isian</button>
      </div>
    `;
  }
}

// Fitur Cetak PDF Lengkap dengan Tanda Tangan & NIP Kepala Dinas
document.getElementById('btnPrintPdf').addEventListener('click', function() {
  const win = window.open('', '_blank');
  win.document.write(`
    <html>
    <head>
      <title>Cetak PDF M-KK Risk Sulawesi Tengah</title>
      <style>
        body { font-family: Georgia, serif; font-size: 12px; color: #111; padding: 25px; line-height: 1.4; }
        h1, h2, h3 { color: #122540; text-align: center; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 11px; color: #555; margin-bottom: 25px; font-family: Arial, sans-serif; }
        .section-box { border: 1px solid #aaa; padding: 15px; margin-bottom: 25px; border-radius: 6px; background: #fff; page-break-inside: avoid; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #888; padding: 6px; text-align: left; vertical-align: top; }
        th { background: #122540; color: #fff; text-align: center; }
        .ttd-area { margin-top: 25px; float: right; text-align: center; font-family: Arial, sans-serif; font-size: 12px; }
        .clear { clear: both; }
      </style>
    </head>
    <body>
      <h1>PEMERINTAH PROVINSI SULAWESI TENGAH</h1>
      <h2>DINAS PEMBERDAYAAN MASYARAKAT DAN DESA</h2>
